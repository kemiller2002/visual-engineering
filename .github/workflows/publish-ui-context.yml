name: Publish UI agent context

on:
  push:
    branches:
      - main
    paths:
      - "agent-context/**"
      - "content/**"
      - "knowledge-platform/**"
      - "packages/visual-engineering-context/**"
      - "scripts/build-ui-context.mjs"
      - "scripts/validate-ui-context.mjs"
      - "scripts/test-ui-context.mjs"
      - "package.json"
      - "package-lock.json"
      - "research-publisher.config.mjs"
      - ".github/workflows/publish-ui-context.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ui-context
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Optional bootstrap fallback. Remove this secret after npm trusted
      # publishing is configured; npm will then authenticate through OIDC.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      PACKAGE_NAME: "@echelon-foundry/visual-engineering-context"
      CONTEXT_VERSION: 0.${{ github.run_number }}.${{ github.run_attempt }}
      VE_CONTEXT_VERSION: 0.${{ github.run_number }}.${{ github.run_attempt }}
      VE_GENERATED_AT: ${{ github.event.head_commit.timestamp }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build research catalog
        id: research-build
        run: npm run research:build

      - name: Show research-publisher diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f "build-reports/build-diagnostics.json" ]; then
            diagnostics_file="build-reports/build-diagnostics.json"
          elif [ -f "build-reports/validation-diagnostics.json" ]; then
            diagnostics_file="build-reports/validation-diagnostics.json"
          else
            echo "research-publisher did not produce build or validation diagnostics"
            exit 0
          fi

          if command -v jq >/dev/null 2>&1; then
            jq '.diagnostics[] | select(.severity == "error")' "$diagnostics_file"
          else
            node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const errors = (report.diagnostics || []).filter(
              diagnostic => diagnostic.severity === "error"
            );
            console.log(JSON.stringify(errors, null, 2));
            ' "$diagnostics_file"
          fi

      - name: Upload research-publisher diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-publisher-diagnostics
          path: build-reports/
          if-no-files-found: warn

      - name: Set publish identity and version
        working-directory: packages/visual-engineering-context
        run: |
          npm pkg set name="$PACKAGE_NAME"
          npm pkg set version="$CONTEXT_VERSION"

      - name: Build and validate package
        run: |
          npm run context:build
          npm run context:validate
          npm run context:test
          npm run context:pack

      - name: Publish latest package
        working-directory: packages/visual-engineering-context
        run: npm publish --access public --tag latest
