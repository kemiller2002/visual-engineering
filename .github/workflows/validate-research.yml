name: Validate research

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inventory research
        run: npm run research:inventory

      - name: Validate research
        id: research-validate
        run: npm run research:validate

      - name: Build research site
        id: research-build
        run: npm run research:build

      - name: Show research-publisher diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f "build-reports/build-diagnostics.json" ]; then
            diagnostics_file="build-reports/build-diagnostics.json"
          elif [ -f "build-reports/validation-diagnostics.json" ]; then
            diagnostics_file="build-reports/validation-diagnostics.json"
          else
            echo "research-publisher did not produce build or validation diagnostics"
            exit 0
          fi

          if command -v jq >/dev/null 2>&1; then
            jq '.diagnostics[] | select(.severity == "error")' "$diagnostics_file"
          else
            node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const errors = (report.diagnostics || []).filter(
              diagnostic => diagnostic.severity === "error"
            );
            console.log(JSON.stringify(errors, null, 2));
            ' "$diagnostics_file"
          fi

      - name: Upload research-publisher diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-publisher-diagnostics
          path: build-reports/
          if-no-files-found: warn

      - name: Build UI agent context
        run: npm run context:build

      - name: Validate UI agent context
        run: npm run context:validate

      - name: Test UI context consumer
        run: npm run context:test

      - name: Inspect npm package contents
        run: npm run context:pack

  echelon-capability-rollout:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chore/echelon-capabilities-2026-09-21"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: |
          git fetch origin main
          git checkout origin/main -- ".github/workflows/validate-research.yml"
      - name: SDE
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/state-directed-engineering.git "$RUNNER_TEMP/sde-source"
          (cd "$RUNNER_TEMP/sde-source/distribution" && npm run build:payload)
          if [[ -d .sde || -f .echelon/sde.json ]]; then cmd=upgrade; else cmd=init; fi
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- "$cmd"
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify
      - name: ROS
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/repository-operating-system.git "$RUNNER_TEMP/ros-source"
          if [[ -f .echelon/ros.json ]]; then
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          elif [[ -f .ros/installation.json ]]; then
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- upgrade
          else
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          fi
      - name: Visual Engineering
        run: |
          set -euo pipefail
          if [[ -f .echelon/visual-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/visual-engineering@1.0.0 "$cmd"
      - name: Communication Engineering
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/communication-engineering.git "$RUNNER_TEMP/communication-engineering-source"
          if [[ -f .echelon/communication-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" "$cmd"
      - name: Limen
        run: |
          set -euo pipefail
          if [[ ! -f limen.config.json ]]; then
            printf '%s\n' '{"configurationVersion":1,"boundary":{"engine":[],"kernel":[]}}' > limen.config.json
          fi
          if [[ -f .echelon/limen.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 "$cmd"
      - name: Verify combined state
        run: |
          set -euo pipefail
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- verify --strict
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" verify --strict
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 verify --strict
      - name: Commit non-workflow rollout state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD -- .github/workflows
          git rm --ignore-unmatch .echelon-rollout-trigger
          git add -A
          git reset .github/workflows
          if git diff --cached --quiet; then
            echo "No non-workflow repository changes required."
            exit 0
          fi
          git commit -m "chore: install current Echelon engineering capabilities"
          git push origin HEAD:"chore/echelon-capabilities-2026-09-21"
