name: Validate research

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for commit batch
        if: github.event_name != 'workflow_dispatch'
        run: sleep 600

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inventory research
        run: npm run research:inventory

      - name: Validate research
        id: research-validate
        run: npm run research:validate

      - name: Validate layout catalog
        run: npm run layouts:validate

      - name: Test layout catalog validator
        run: npm run layouts:test

      - name: Test SequentialReveal reference model
        run: npm run reveal:test

      - name: Validate reference workflows
        run: npm run workflows:validate

      - name: Test character-grid layout validator
        run: npm run workflows:test

      - name: Test EX-VE-TCG-2026-319C pilot machinery
        run: npm run tcg319c:test

      - name: Install Chromium for the EX-VE-TCG-2026-319C mechanics check
        run: npx playwright-core install --with-deps chromium

      - name: Run EX-VE-TCG-2026-319C harness mechanics check (scripted agent, not participant data)
        run: npm run tcg319c:mechanics

      - name: Build research site
        id: research-build
        run: npm run research:build

      - name: Show research-publisher diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f "build-reports/build-diagnostics.json" ]; then
            diagnostics_file="build-reports/build-diagnostics.json"
          elif [ -f "build-reports/validation-diagnostics.json" ]; then
            diagnostics_file="build-reports/validation-diagnostics.json"
          else
            echo "research-publisher did not produce build or validation diagnostics"
            exit 0
          fi

          if command -v jq >/dev/null 2>&1; then
            jq '.diagnostics[] | select(.severity == "error")' "$diagnostics_file"
          else
            node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const errors = (report.diagnostics || []).filter(
              diagnostic => diagnostic.severity === "error"
            );
            console.log(JSON.stringify(errors, null, 2));
            ' "$diagnostics_file"
          fi

      - name: Upload research-publisher diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-publisher-diagnostics
          path: build-reports/
          if-no-files-found: warn

      - name: Build UI agent context
        run: npm run context:build

      - name: Validate UI agent context
        run: npm run context:validate

      - name: Test UI context consumer
        run: npm run context:test

      - name: Inspect npm package contents
        run: npm run context:pack
